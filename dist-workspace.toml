[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.29.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# publish-jobs = ["./check", "./test"]

# System dependencies to install for each runner
[dist.dependencies.apt]
# OpenSSL development libraries for Linux builds
openssl = "libssl-dev"
pkg-config = "pkg-config"
# Node.js and npm for Linux builds
nodejs = "nodejs"
npm = "npm"

[dist.dependencies.homebrew]
# OpenSSL for macOS builds
openssl = "openssl@3"
pkg-config = "pkg-config"
# Node.js and npm for macOS
node = "node"

[dist.dependencies.chocolatey]
# OpenSSL and Node.js for Windows builds
openssl = "openssl"
nodejs = "nodejs"
